name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GUI_DIR: cmd/npc/npc-gui
  APP_NAME: npc-gui

jobs:

  # ==================== 跨平台服务端/客户端打包 ====================
  build_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.22"
      - name: Check out code
        uses: actions/checkout@v2
      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi
      - name: Build
        run: |
          chmod +x build.assets.sh
          ./build.assets.sh
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            freebsd_386_client.tar.gz
            freebsd_386_server.tar.gz
            freebsd_amd64_client.tar.gz
            freebsd_amd64_server.tar.gz
            freebsd_arm_client.tar.gz
            freebsd_arm_server.tar.gz
            linux_386_client.tar.gz
            linux_386_server.tar.gz
            linux_amd64_client.tar.gz
            linux_amd64_server.tar.gz
            linux_arm64_client.tar.gz
            linux_arm64_server.tar.gz
            linux_arm_v5_client.tar.gz
            linux_arm_v6_client.tar.gz
            linux_arm_v7_client.tar.gz
            linux_arm_v5_server.tar.gz
            linux_arm_v6_server.tar.gz
            linux_arm_v7_server.tar.gz
            linux_mips64le_client.tar.gz
            linux_mips64le_server.tar.gz
            linux_mips64_client.tar.gz
            linux_mips64_server.tar.gz
            linux_mipsle_client.tar.gz
            linux_mipsle_server.tar.gz
            linux_mips_client.tar.gz
            linux_mips_server.tar.gz
            darwin_amd64_client.tar.gz
            darwin_amd64_server.tar.gz
            darwin_arm64_client.tar.gz
            darwin_arm64_server.tar.gz
            windows_386_client.tar.gz
            windows_386_server.tar.gz
            windows_amd64_client.tar.gz
            windows_amd64_server.tar.gz
            npc_sdk.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Android APK ====================
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.android.sh
          docker run --rm -i -w /app -v $(pwd):/app -e ANDROID_HOME=/usr/local/android_sdk -e GOPROXY=direct fyneio/fyne-cross:android-latest /app/build.android.sh
          ls -la android_client.apk
      - name: Upload
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            android_client.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Docker 镜像 ====================
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push nps
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.nps
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:${{ env.RELEASE_VERSION }}
      - name: Build and push npc
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.npc
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:${{ env.RELEASE_VERSION }}

  # ==================== Windows GUI ====================
  build_windows_gui:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: windows/386
            os_name: windows
            arch: 386
          - platform: windows/amd64
            os_name: windows
            arch: amd64
          - platform: windows/arm64
            os_name: windows
            arch: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Build and package (Windows)
        shell: pwsh
        working-directory: ${{ env.GUI_DIR }}
        run: |
          $env:GOFLAGS = "-tags=npcgui"
          go tool mygo build -skip-installer -platform windows/${{ matrix.arch }}
          $out = Join-Path "bin" "windows-${{ matrix.arch }}"
          $exe = Get-ChildItem -Path $out -Filter *.exe | Where-Object { $_.Name -notmatch 'setup' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "No build output found in $out"
            Get-ChildItem -Path $out | Format-Table -AutoSize
            exit 1
          }

          # UPX 压缩可执行文件（约 22 MB -> 7 MB）。
          $upxDir = Join-Path $env:RUNNER_TEMP "upx"
          New-Item -ItemType Directory -Force $upxDir | Out-Null
          $upxZip = Join-Path $upxDir "upx.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip" -OutFile $upxZip
          Expand-Archive -Path $upxZip -DestinationPath $upxDir -Force
          $upx = Get-ChildItem -Path $upxDir -Recurse -Filter upx.exe | Select-Object -First 1
          if (-not $upx) {
            Write-Host "UPX not found"
            exit 1
          }
          & $upx.FullName --best --lzma $exe.FullName
          if ($LASTEXITCODE -ne 0) {
            Write-Host "UPX failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Packed size: $([math]::Round((Get-Item $exe.FullName).Length / 1MB, 2)) MB"

          Compress-Archive -Path $exe.FullName -DestinationPath (Join-Path $out "$env:APP_NAME-windows-${{ matrix.arch }}.zip") -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/windows-${{ matrix.arch }}/${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip
      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/windows-${{ matrix.arch }}/${{ env.APP_NAME }}-windows-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== macOS GUI ====================
  build_macos_gui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: darwin/amd64
            os_name: darwin
            arch: amd64
            os: macos-14
          - platform: darwin/arm64
            os_name: darwin
            arch: arm64
            os: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Build and package (macOS)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          export GOFLAGS="-tags=npcgui"
          go tool mygo build -skip-dmg -platform darwin/${{ matrix.arch }}
          cd "bin/darwin-${{ matrix.arch }}"
          app="$(ls -1d *.app 2>/dev/null | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo "No build output found in bin/darwin-${{ matrix.arch }}"
            ls -la
            exit 1
          fi
          zip -q -r "$APP_NAME-darwin-${{ matrix.arch }}.zip" "$app"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/darwin-${{ matrix.arch }}/${{ env.APP_NAME }}-darwin-${{ matrix.arch }}.zip
      - name: Upload macOS release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/darwin-${{ matrix.arch }}/${{ env.APP_NAME }}-darwin-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Linux GUI ====================
  build_linux_gui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os_name: linux
            arch: amd64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Build and package (Linux)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          export GOFLAGS="-tags=npcgui"
          go tool mygo build -platform linux/${{ matrix.arch }}
          cd "bin/linux-${{ matrix.arch }}"
          bin="$(find . -maxdepth 1 -type f -perm -111 ! -name '*.sh' -printf '%f\n' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No executable file found in bin/linux-${{ matrix.arch }}"
            ls -la
            exit 1
          fi
          zip -q "$APP_NAME-linux-${{ matrix.arch }}.zip" "$bin"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/linux-${{ matrix.arch }}/${{ env.APP_NAME }}-linux-${{ matrix.arch }}.zip
      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.GUI_DIR }}/bin/linux-${{ matrix.arch }}/${{ env.APP_NAME }}-linux-${{ matrix.arch }}.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 发布说明 ====================
  release_notes:
    runs-on: ubuntu-latest
    needs: [build_assets, build_android, build_windows_gui, build_macos_gui, build_linux_gui]
    if: always() && github.ref_type == 'tag'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Update release notes from changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          awk -v v="$tag" '
            $0 ~ "^- .* " v "$" { f=1; next }
            f && /^- / { exit }
            f { print }
          ' docs/changelog/index.md | sed 's/^  //' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for $tag"
            exit 1
          fi
          gh release edit "$tag" --notes-file release-notes.md
